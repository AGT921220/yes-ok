networks:
  appnetwork:

services:

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-yes-ok
    restart: always
    ports:
      - "${PORT_NGINX:-80}:80"
      # - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/${NGINX_CONF_FILE:-default.conf}:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/logs:/var/log/nginx
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      - php
      - redis
    networks:
      - appnetwork

  mysql:
    image: mysql:8.0
    container_name: mysql-yes-ok
    restart: always
    tty: true
    ports:
      - "${PORT_MYSQL:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-pasword}
      - MYSQL_DATABASE=${DB_DATABASE:-db}
      - MYSQL_USER=${DB_USERNAME:-user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-pasword}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis-yes-ok
    restart: always
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - appnetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  php:
    environment:
      APP_ENV: ${APP_ENV:-local}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Red y MySQL por nombre de servicio de Compose (sobrescribe .env dentro del contenedor)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mysql
    build:
      context: .
      dockerfile: Dockerfile
      target: fpm
    container_name: php-yes-ok
    restart: always
    volumes:
      - .:/var/www/html/
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./.env:/var/www/html/.env
    ports:
      - "${PORT_PHP_MAPPING:-9000}:9000"
    networks:
      - appnetwork
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    container_name: horizon-yes-ok
    restart: always
    working_dir: /var/www/html
    command: php artisan horizon
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mysql
    volumes:
      - .:/var/www/html/
      - ./.env:/var/www/html/.env
    networks:
      - appnetwork
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    container_name: scheduler-yes-ok
    restart: always
    working_dir: /var/www/html
    command: php artisan schedule:work
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mysql
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
    networks:
      - appnetwork
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-yes-ok
    restart: always
    ports:
      - "${PORT_PHPMYADMIN:-8080}:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=${DB_USERNAME:-user}
      - PMA_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-pasword}
    networks:
      - appnetwork
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
